version: '3.8'

services:
  vicente-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vicente_rag_assistant
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - APP_SECRET=${APP_SECRET:-vicente_enterprise_super_secret_session_key_2026}
    volumes:
      - vicente_data:/app/data

volumes:
  vicente_data:
    driver: local
